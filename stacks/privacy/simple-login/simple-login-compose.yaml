# ==============================================================================
# SERVICE: SimpleLogin
# DESCRIPTION: 
#
#
#
# ==============================================================================
#
services:
  sl-db:
    image: postgres:12.1
    container_name: sl-db
    environment:
      POSTGRES_PASSWORD: ${SL_DB_PASSWORD}
      POSTGRES_USER: ${SL_DB_USER}
      POSTGRES_DB: ${SL_DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simple-login-db-vol:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sl-network

  sl-migration:
    image: &sl-image simplelogin/app:4.6.5-beta
    container_name: sl-migration
    command: alembic upgrade head
    volumes:
      - simple-login-app-vol:/sl
      - simple-login-upload-vol:/code/static/upload
    secrets:
      - source: sl_dkim_key
        target: /dkim.key
      - source: sl_dkim_pub_key
        target: /dkim.pub.key
      - source: sl_env_file
        target: /code/.env
    networks:
      - sl-network
    depends_on:
      sl-db:
        condition: service_healthy

  sl-init:
    image: *sl-image #
    container_name: sl-init
    command: python init_app.py
    volumes:
      - simple-login-app-vol:/sl
    secrets:
      - source: sl_dkim_key
        target: /dkim.key
      - source: sl_dkim_pub_key
        target: /dkim.pub.key
      - source: sl_env_file
        target: /code/.env
    networks:
      - sl-network
    depends_on:
      sl-migration:
        condition: service_completed_successfully

  sl-app:
    image: *sl-image
    container_name: sl-app
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - simple-login-app-vol:/sl
      - simple-login-upload-vol:/code/static/upload
    secrets:
      - source: sl_dkim_key
        target: /dkim.key
      - source: sl_dkim_pub_key
        target: /dkim.pub.key
      - source: sl_env_file
        target: /code/.env
    restart: unless-stopped
    networks:
      - sl-network
    depends_on:
      sl-init:
        condition: service_completed_successfully

  sl-email:
    image: *sl-image
    container_name: sl-email
    command: python email_handler.py
    ports:
      - "127.0.0.1:20381:20381"
    volumes:
      - simple-login-app-vol:/sl
      - simple-login-upload-vol:/code/static/upload
    secrets:
      - source: sl_dkim_key
        target: /dkim.key
      - source: sl_dkim_pub_key
        target: /dkim.pub.key
      - source: sl_env_file
        target: /code/.env
    restart: unless-stopped
    networks:
      - sl-network
    depends_on:
      sl-init:
        condition: service_completed_successfully

  sl-job-runner:
    image: *sl-image
    container_name: sl-job-runner
    command: python job_runner.py
    volumes:
      - simple-login-app-vol:/sl
      - simple-login-upload-vol:/code/static/upload
    secrets:
      - source: sl_dkim_key
        target: /dkim.key
      - source: sl_dkim_pub_key
        target: /dkim.pub.key
      - source: sl_env_file
        target: /code/.env
    restart: unless-stopped
    networks:
      - sl-network
    depends_on:
      sl-init:
        condition: service_completed_successfully

volumes:
  simple-login-db-vol:
    external: true
  simple-login-app-vol:
    external: true
  simple-login-upload-vol:
    external: true

secrets:
  sl_dkim_key:
    external: true
  sl_dkim_pub_key:
    external: true
  sl_env_file:
    external: true

networks:
  sl-network:
    external: true
