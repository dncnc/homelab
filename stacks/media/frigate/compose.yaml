# ==============================================================================
# SERVICE: Frigate
# DESCRIPTION: Frigate is an open source NVR built around real-time AI object
#              detection. All processing is performed locally on your own 
#              hardware, and your camera feeds never leave your home.
#              https://https://frigate.video/
# ==============================================================================
#
name: frigate
services:
  frigate:
    container_name: frigate
    privileged: true
    restart: unless-stopped
    stop_grace_period: 30s
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: 256mb
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - frigate-vol:/config
      - ${FRIGATE_MEDIA_PATH}:/media/frigate
        - type: tmpfs
          target: /tmp/cache
          tmpfs:
            size: 1000000000
    ports:
      - "1984:1984"     # Go2RTC Web UI
      - "5000:5000"     # Web UI (http)
      - "8971:8971"     # Web UI (https)
      - "8554:8554"     # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      TZ: "America/Toronto"
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD:?set FRIGATE_RTSP_PASSWORD}"

volumes:
  frigate-vol:
    external: true